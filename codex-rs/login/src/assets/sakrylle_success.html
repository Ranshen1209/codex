<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Signed in to Sakrylle</title>
    <style>
      :root {
        --font-use: "SF Pro", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --sakrylle-purple: #9181bd;
        --sakrylle-purple-light: #b8a9d4;
        --sakrylle-purple-dark: #6b5a96;
        --gray-0: #ffffff;
        --gray-50: #f9f9f9;
        --gray-100: #ededed;
        --gray-300: #afafaf;
        --gray-500: #5d5d5d;
        --gray-900: #181818;
        --gray-1000: #0d0d0d;
        --color-background-surface: var(--gray-0);
        --color-text-foreground: var(--gray-1000);
        color: var(--color-text-foreground);
        background: var(--color-background-surface);
        font-family: var(--font-use);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-background-surface: var(--gray-900);
          --color-text-foreground: var(--gray-0);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--color-background-surface);
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 56px 24px;
      }

      .content {
        width: min(100%, 560px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        text-align: center;
      }

      .logo-ring {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--sakrylle-purple), var(--sakrylle-purple-dark));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(145, 129, 189, 0.3);
      }

      .checkmark {
        width: 32px;
        height: 32px;
        color: white;
      }

      .title {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }

      .message {
        margin: 0;
        color: var(--gray-500);
        font-size: 16px;
        line-height: 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--sakrylle-purple);
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="content">
        <div class="logo-ring">
          <svg class="checkmark" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <h1 class="title">You're signed in</h1>
        <p class="message">You may now close this tab and return to the terminal.</p>
        <div class="brand">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 12l3 3 5-5"/>
          </svg>
          <span>Sakrylle</span>
        </div>
      </div>
    </main>
  </body>
</html>
