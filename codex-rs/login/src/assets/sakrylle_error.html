<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sakrylle Sign-in Error</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
          Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background: radial-gradient(circle at top, #f0edf5 0%, #ffffff 48%);
        color: #0d0d0d;
      }
      .container {
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: min(680px, 100%);
        border-radius: 16px;
        border: 1px solid rgba(145, 129, 189, 0.2);
        box-shadow: 0 12px 32px rgba(145, 129, 189, 0.08);
        background: #ffffff;
        padding: 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: linear-gradient(135deg, #9181bd, #6b5a96);
      }
      .brand-title {
        font-size: 14px;
        color: #5d5d5d;
      }
      h1 {
        margin: 18px 0 10px;
        font-size: 28px;
        line-height: 1.2;
      }
      .message {
        margin: 0;
        font-size: 16px;
        line-height: 1.45;
      }
      .details {
        margin-top: 18px;
        border-radius: 12px;
        border: 1px solid rgba(145, 129, 189, 0.15);
        background: #faf8fc;
        padding: 14px;
        display: grid;
        gap: 8px;
      }
      .details-row {
        display: grid;
        grid-template-columns: 136px 1fr;
        gap: 10px;
        font-size: 13px;
        align-items: baseline;
      }
      .details-row strong {
        color: #5d5d5d;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        word-break: break-all;
      }
      .help {
        margin-top: 16px;
        font-size: 14px;
        color: #5d5d5d;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M8 12l3 3 5-5"/>
            </svg>
          </div>
          <div class="brand-title">Sakrylle login</div>
        </div>

        <h1>{{error_title}}</h1>
        <p class="message">{{error_message}}</p>

        <div class="details">
          <div class="details-row">
            <strong>Error code</strong>
            <code>{{error_code}}</code>
          </div>
          <div class="details-row">
            <strong>Details</strong>
            <code>{{error_description}}</code>
          </div>
        </div>

        <p class="help">{{error_help}}</p>
      </div>
    </div>
  </body>
</html>
