<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signed in to Sakrylle API</title>
    <style>
      :root {
        --font-use: "SF Pro", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --background: #fbfaff;
        --surface: #ffffff;
        --border: #e4dfef;
        --text: #242137;
        --muted: #6f6887;
        --accent: #8f82bd;
        --accent-soft: #f5f3fb;
        --logo: #ff7383;
        color: var(--text);
        background: var(--background);
        font-family: var(--font-use);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #15131d;
          --surface: #1e1b29;
          --border: #383247;
          --text: #f7f4ff;
          --muted: #b9b0cf;
          --accent-soft: #272233;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--background);
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
      }

      .card {
        width: min(100%, 620px);
        min-height: 430px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 64px 40px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--surface);
        text-align: center;
        box-shadow: 0 18px 48px rgba(104, 91, 150, 0.08);
      }

      .product-icon {
        width: 42px;
        height: 42px;
        object-fit: contain;
      }

      .success-mark {
        width: 104px;
        height: 104px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent-soft);
      }

      .success-mark svg {
        width: 46px;
        height: 46px;
        color: var(--accent);
      }

      .copy {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .title {
        margin: 0;
        color: var(--text);
        font-size: 28px;
        font-weight: 700;
        line-height: 1.25;
      }

      .message {
        margin: 0;
        color: var(--muted);
        font-size: 18px;
        font-weight: 500;
        line-height: 1.45;
      }

      @media (max-width: 640px) {
        main {
          align-items: flex-start;
          padding: 32px 16px;
        }

        .card {
          min-height: 360px;
          gap: 22px;
          padding: 48px 24px;
          border-radius: 18px;
        }

        .success-mark {
          width: 88px;
          height: 88px;
        }

        .success-mark svg {
          width: 40px;
          height: 40px;
        }

        .title {
          font-size: 24px;
        }

        .message {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="title">
        <img class="product-icon" src="{{PRODUCT_ICON_DATA_URI}}" alt="Sakrylle API" />

        <div class="success-mark" aria-hidden="true">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.5 12.5 10 17 19 7" />
          </svg>
        </div>

        <div class="copy">
          <h1 class="title" id="title">登录成功</h1>
          <p class="message">您已安全登录 Sakrylle API。<br />可以关闭此页面。</p>
        </div>
      </section>
    </main>
  </body>
</html>
